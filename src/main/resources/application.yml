server:
  port: ${PORT:8081}

spring:
  application:
    name: evacs-control-api
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:33306}/${DB_NAME:evacs}?sslMode=${DB_SSL_MODE:DISABLED}&connectionTimeZone=UTC&forceConnectionTimeZoneToSet=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:evacs}
    password: ${DB_PASSWORD:evacs}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6402}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 컨테이너 재기동 판단(liveness)과 의존 서비스 상태(readiness)를 분리한다.
      # /actuator/health는 Redis·DB를 포함하므로 Redis가 느리면 DOWN이 되고,
      # 그걸 Docker HEALTHCHECK에 쓰면 프로세스가 멀쩡한데도 컨테이너가 교체된다.
      # HEALTHCHECK는 liveness(ping)만 본다. Redis 상태는 readiness로 따로 확인한다.
      group:
        liveness:
          include: ping
        readiness:
          include: db,redis
          show-components: always

evacs:
  redis:
    # 실시간 차량 상태의 출처는 Location-Worker가 소유한 세 키다(design.md §2).
    #   h3:cells:active        SET   비어 있지 않은 셀
    #   h3:vehicles:{cellId}   ZSET  member=vehicleId, score=수신 시각 ms
    #   vehicle:{id}:state     Hash  좌표·속도·방향·h3CellId·status (EXPIRE 3600s)
    # 워커가 키 이름을 코드에 고정해 두므로 운영에서는 접두사를 비워 둬야 한다.
    # 테스트가 같은 Redis를 쓸 때만 격리용으로 'test:' 같은 값을 넣는다.
    # stream:vehicle:state는 읽지 않는다 — 그 이벤트에는 좌표가 없고 셀 변경 사실만 있다.
    key-prefix: ${EVACS_REDIS_KEY_PREFIX:}
    # Emergency Worker가 긴급차량의 영향 셀(cone)과 알림 수신 차량을 기록하는 키 패턴.
    cone-key-pattern: ${EVACS_CONE_KEY_PATTERN:evacs:emergency:%s:cone}
    alert-key-pattern: ${EVACS_ALERT_KEY_PATTERN:evacs:emergency:%s:alerted}
    # OutboxProcessor가 긴급상황 이벤트를 발행하는 스트림.
    emergency-stream: ${EVACS_EMERGENCY_STREAM:evacs:stream:emergency-event}
    emergency-stream-maxlen: ${EVACS_EMERGENCY_STREAM_MAXLEN:10000}
  vehicle:
    # Location Worker의 INACTIVE_TTL_MS와 같은 값이어야 한다(워커 기본값 5000).
    # 워커가 이 기준으로 셀 ZSET에서 빼고 status=INACTIVE를 찍는다.
    # 오래된 항목 정리는 워커가 하므로 관제 API에는 스위퍼가 없다.
    active-ttl-ms: ${EVACS_VEHICLE_ACTIVE_TTL_MS:5000}
    default-density-resolution: ${EVACS_DENSITY_RESOLUTION:9}
  alert:
    # Alert Worker가 양보 알림(발행·해제)과 경로 변경 알림을 발행하는 스트림.
    # ws-server도 같은 스트림을 소비한다(그쪽은 소비자 그룹 'ws-server').
    # 관제 API는 그룹 없이 커서(entry id)만 들고 XREAD로 따라 읽어 "지금 알림이 떠 있는 차량"을 만든다.
    enabled: ${EVACS_ALERT_STREAM_ENABLED:true}
    stream: ${EVACS_ALERT_STREAM:evacs:stream:yield-alert}
    poll-interval-ms: ${EVACS_ALERT_POLL_INTERVAL_MS:500}
    # expiresAt이 없는 알림(경로 변경 등)을 들고 있는 시간. 해제 이벤트가 유실돼도 화면에서 사라진다.
    ttl-ms: ${EVACS_ALERT_TTL_MS:60000}
    bootstrap-count: ${EVACS_ALERT_BOOTSTRAP_COUNT:500}
    batch-size: ${EVACS_ALERT_BATCH_SIZE:500}
  outbox:
    enabled: ${EVACS_OUTBOX_ENABLED:true}
    poll-interval-ms: ${EVACS_OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${EVACS_OUTBOX_BATCH_SIZE:100}
    max-attempts: ${EVACS_OUTBOX_MAX_ATTEMPTS:5}
  sumo:
    # isSumo=true로 들어온 긴급상황을 SUMO 시뮬레이터(EVACS-SUMO-Continuous/app.py)에 투입한다.
    # 커밋 후에 POST {base-url}/api/emergency {depotId,destinationLat,destinationLng,vehicleId}.
    # 실차 운영에서는 enabled=false로 두어 시뮬레이터 호출 경로를 막는다.
    enabled: ${EVACS_SUMO_ENABLED:true}
    base-url: ${EVACS_SUMO_BASE_URL:http://127.0.0.1:8000}
    default-depot-id: ${EVACS_SUMO_DEPOT_ID:yonghyeon}
    timeout-ms: ${EVACS_SUMO_TIMEOUT_MS:8000}
    
logging:
  level:
    com.evacs.control: DEBUG
