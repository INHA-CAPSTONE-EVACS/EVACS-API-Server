# 로컬/테스트용 의존 서비스. 앱은 포함하지 않는다(호스트에서 gradle로 띄운다).
#   docker compose -f docker/compose.yml up -d --wait
# 프로젝트명을 고정해 두지 않으면 폴더명(docker)에서 유도돼 다른 레포와 네트워크가 섞인다.
name: evacs-api

services:
  mysql:
    image: mysql:8.4
    container_name: evacs_api_db
    command:
      # 앱은 모든 시각을 UTC Instant로 다룬다. 서버 타임존을 UTC로 고정해
      # datetime(6) 컬럼과 JDBC connectionTimeZone=UTC가 어긋나지 않게 한다.
      - "--default-time-zone=+00:00"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: evacs
      MYSQL_PASSWORD: evacs
      MYSQL_DATABASE: evacs
      TZ: UTC
    ports:
      # 호스트 33306 — onnovel(3306)·기본 3306과 겹치지 않게 띄운다.
      - "33306:3306"
    volumes:
      - evacs_api_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uevacs", "-pevacs"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: evacs_api_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # 호스트 6402 — evacs-ws-server(6401)와 분리된 포트.
      # 단, 실시간 연동을 확인할 때는 ws-server와 같은 Redis를 봐야 하므로
      # 그때는 이 컨테이너를 쓰지 말고 .env의 REDIS_PORT를 6401로 맞춘다.
      - "6402:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  evacs_api_mysqldata:
